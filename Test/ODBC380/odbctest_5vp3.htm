    <h1><font face="Verdana, Arial, Helvetica" size="2"><a name="odbcgeneral_output_window"></a>General Output
    Window</font></h1>

    <p><font face="Verdana, Arial, Helvetica" size="2">ODBC Test has a single general output window. It uses this window to
    display information that is not directly related to a connection. For example, ODBC Test displays the output of the
    <b>SQLAllocHandle</b> with a <i>HandleType</i> of SQL_HANDLE_ENV function in the general output window.</font></p>
