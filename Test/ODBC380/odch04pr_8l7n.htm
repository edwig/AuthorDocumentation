    <h1><font face="Verdana, Arial, Helvetica" size="2"><a name="odbcdata_types_in_odbc"></a>Data Types in ODBC</font></h1>

    <p><font face="Verdana, Arial, Helvetica" size="2">ODBC uses two sets of data types: SQL data types and C data types. SQL
    data types are used in the data source and C data types are used in C code in the application.</font></p>
