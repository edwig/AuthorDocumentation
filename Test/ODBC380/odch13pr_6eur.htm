    <h2><font face="Verdana, Arial, Helvetica" size="2"><a name="odbcobtaining_descriptor_handles"></a>Obtaining Descriptor
    Handles</font></h2>

    <p><font face="Verdana, Arial, Helvetica" size="2">An application obtains the handle of any explicitly allocated descriptor
    as an output argument of the call to <b>SQLAllocHandle</b>. The handle of an implicitly allocated descriptor is obtained by
    calling <b>SQLGetStmtAttr.</b></font></p>
