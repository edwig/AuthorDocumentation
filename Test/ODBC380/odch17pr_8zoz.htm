    <h2><font face="Verdana, Arial, Helvetica" size="2"><a name="odbccstring_class"></a>CString Class</font></h2>

    <p><font face="Verdana, Arial, Helvetica" size="2">Because objects of the CString class in Microsoft<sup>&#174;</sup>
    Visual C++<sup>&#174;</sup> are signed and string arguments in ODBC functions are unsigned, applications that pass CString
