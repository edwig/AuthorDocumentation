    <h3><font face="Verdana, Arial, Helvetica" size="2"><a name="odbcodbc_sql_grammar"></a>ODBC SQL Grammar</font></h3>

    <p><font face="Verdana, Arial, Helvetica" size="2">Interoperable applications should always use the ODBC SQL grammar in SQL
