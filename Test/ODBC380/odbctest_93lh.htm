<head>

    <title>Window Menu</title>
    <link disabled rel="stylesheet" href="msdn_ie3.css" type="text/css">
    <style type="text/css">
@import url(msdn_ie4.css);
    </style>
</head>

<body>
    <font face="Verdana, Arial, Helvetica" size="2">
    <!--TOOLBAR_START-->
     
    <!--TOOLBAR_EXEMPT-->
     
    <!--TOOLBAR_END--></font>

    <h1><font face="Verdana, Arial, Helvetica" size="2"><a name="window_menu"></a>Window Menu</font></h1>

    <table border="1" cellpadding="5" cols="2" frame="below" rules="rows" width="587">
        <tr valign="top">
            <td class="label" width="31%"><b>Command</b></td>

            <td class="label" width="69%"><b>Description</b></td>
        </tr>

        <tr valign="top">
            <td width="31%"><b>Cascade</b></td>

            <td width="69%">Cascades all windows.</td>
        </tr>

        <tr valign="top">
            <td width="31%"><b>Tile</b></td>

            <td width="69%">Tiles all windows vertically.</td>
        </tr>

        <tr valign="top">
            <td width="31%"><b>Tile Horizontal</b></td>

            <td width="69%">Tiles all windows horizontally.</td>
        </tr>

        <tr valign="top">
            <td width="31%"><b>Arrange Icons</b></td>

            <td width="69%">Arranges all minimized window icons.</td>
        </tr>

        <tr valign="top">
            <td width="31%"><b>Close All</b></td>

            <td width="69%">Closes all windows.</td>
        </tr>

        <tr valign="top">
            <td width="31%"><b>List of Open Windows</b></td>

            <td width="69%">Lists each open window by name.</td>
        </tr>
    </table><font face="Verdana, Arial, Helvetica" size="2"><br></font>
</body>
</html>
