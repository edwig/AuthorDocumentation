    <h1><font face="Verdana, Arial, Helvetica" size="2"><a name="odbcpseudo_type_identifiers"></a>Pseudo Type
    Identifiers</font></h1>

    <p><font face="Verdana, Arial, Helvetica" size="2">For application programming convenience, ODBC defines a number of pseudo
    type identifiers. These identifiers do not actually correspond to actual data types, but instead resolve to existing data
    types depending on the situation.</font></p>
