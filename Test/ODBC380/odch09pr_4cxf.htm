    <h1><font face="Verdana, Arial, Helvetica" size="2"><a name="odbcexecuting_statements"></a>Overview of Executing
    Statements</font></h1>

    <p><font face="Verdana, Arial, Helvetica" size="2">ODBC applications perform almost all database access by executing SQL
    statements. The general sequence of events is to allocate a statement handle, set any statement attributes, execute the
    statement, retrieve any results, and free the statement handle.</font></p>
