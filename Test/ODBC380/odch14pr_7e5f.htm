    <h1><font face="Verdana, Arial, Helvetica" size="2"><a name="odbctransactions_in_odbc"></a>Transactions in ODBC</font></h1>

    <p><font face="Verdana, Arial, Helvetica" size="2">Transactions in ODBC are completed at the connection level; that is,
    when an application completes a transaction, it commits or rolls back all work done through all statement handles on that
    connection.</font></p>
