    <h2><font face="Verdana, Arial, Helvetica" size="2"><a name="odbcsqlfreeconnect_mapping"></a>SQLFreeConnect
    Mapping</font></h2>

    <p><font face="Verdana, Arial, Helvetica" size="2">When an application calls <b>SQLFreeConnect</b> through an ODBC 3.x
    driver, the call to:</font></p>
    <pre>
<font face="Verdana, Arial, Helvetica" size="2"><code>SQLFreeConnect(hdbc) 
</code></font>
</pre>

    <p><font face="Verdana, Arial, Helvetica" size="2">is mapped to:</font></p>
    <pre>
<font face="Verdana, Arial, Helvetica" size="2"><code>SQLFreeHandle(SQL_HANDLE_DBC,Handle)
</code></font>
</pre>

    <p><font face="Verdana, Arial, Helvetica" size="2">with the <i>Handle</i> argument set to the value in
    <i>hdbc</i>.</font></p>
</body>
