    <h2><font face="Verdana, Arial, Helvetica" size="2"><a name="odbcusing_data_buffers"></a>Using Data Buffers</font></h2>

    <p><font face="Verdana, Arial, Helvetica" size="2">Data buffers are described by three pieces of information: their type,
    address, and byte length. Whenever a function needs one of these pieces of information and does not already know it, it has
    an argument with which the application passes it.</font></p>
